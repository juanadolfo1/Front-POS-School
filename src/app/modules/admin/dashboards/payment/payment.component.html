<div class="flex flex-col flex-auto win-w-0">
    <div class="bg-card">
        <div class="flex flex-col w-full max-w-screen-xl mx-auto px-6 sm:px-8">
            <div
                class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 w-full min-w-0 my-8 sm:my-3"
            >
                <div class="flex flex-col content-center w-full">
                    <ng-select
                        [items]="scholarYears"
                        bindLabel="year"
                        bindValue="id"
                        placeholder="Selecciona un ciclo escolar"
                        [formControl]="scholarYear"
                    ></ng-select>
                </div>
                <div class="flex flex-col content-center w-full">
                    <ng-select
                        [items]="academicLevels"
                        bindLabel="label"
                        bindValue="id"
                        [formControl]="academicLevel"
                        placeholder="Selecciona un nivel académico"
                    >
                    </ng-select>
                </div>
                <div class="flex flex-col content-center w-full">
                    @if(groups.length){
                    <ng-select
                        [items]="groups"
                        bindLabel="label"
                        bindValue="id"
                        [formControl]="group"
                        placeholder="Selecciona un grupo"
                    >
                    </ng-select>
                    }
                </div>
                <div class="grid grid-cols-1 gap-2 lg:grid-cols-2  w-full">
                    <button
                        class="fuse-mat-button-rounded self-center mx-auto w-40"
                        mat-flat-button
                        [color]="'primary'"
                        (click)="getStudentsByGroup()"
                    >
                        <mat-icon
                            class="icon-size-5"
                            [svgIcon]="'heroicons_solid:search'"
                        ></mat-icon>
                        <span class="ml-2 hidden lg:block">Buscar grupo</span>
                    </button>
                    <button
                        class="fuse-mat-button-rounded self-center mx-auto w-40"
                        mat-flat-button
                        [color]="'primary'"
                        (click)="openQrModal()"
                    >
                        <mat-icon
                            class="icon-size-5"
                            [svgIcon]="'heroicons_solid:qrcode'"
                        ></mat-icon>
                        <span class="ml-2 hidden lg:block">Buscar con QR</span>
                    </button>
                </div>
                <div class="grid grid-cols-1 gap-2 lg:grid-cols-2 w-full" >
                    <button
                        class="fuse-mat-button-rounded self-center mx-auto w-40"
                        mat-flat-button
                        [color]="'primary'"
                        (click)="openDateSelectorModal()"
                    >
                        <mat-icon
                            class="icon-size-5"
                            [svgIcon]="'heroicons_solid:document-download'"></mat-icon>
                        <span class="ml-2 hidden lg:block">Corte de caja</span>
                    </button>
                    <button
                        class="fuse-mat-button-rounded self-center mx-auto w-40"
                        mat-flat-button
                        [color]="'primary'"
                        (click)="getPendingPaymentReport()"
                    >
                        <mat-icon
                            class="icon-size-5"
                            [svgIcon]="'heroicons_solid:document-download'"></mat-icon>
                        <span class="ml-2 hidden lg:block">Reporte de pagos</span>
                    </button>
                </div>
            </div>
            <div
                class="relative flex self-start pt-2 pb-1 pl-5 pr-4 cursor-pointer overflow-hidden rounded-t-xl border border-b-0 bg-default"
                matRipple
            >
                <div class="flex items-center">
                    <div class="overflow-hidden">
                        <div class="font-medium leading-6 truncate">
                            Gestión de pagos
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    @if(isLoading){
    <app-spinner></app-spinner>
    } @else { @if (students.length) {
    <div class="flex-auto border-t mt-px pt-4 pb-6 sm:pt-6">
        <div class="w-auto max-w-screen-xl mx-10">
            <div class="grid grid-cols-1 gap-6 w-full min-w-0">
                <p-table [value]="students" [totalRecords]="students.length">
                    <ng-template pTemplate="header">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Grupo</th>
                            <th>Acciones</th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-student>
                        <tr>
                            <td>{{ student.id }}</td>
                            <td>
                                {{ student.name }} {{ student.first_lastname }}
                                {{ student.second_lastname }}
                            </td>
                            <td>{{ currentGroup() }}</td>
                            <td class="grid grid-cols-2">
                                <button
                                    *hasOperation="'dashboards/payments:Cobrar'"
                                    (click)="
                                        openPaymentModal(
                                            student.id,
                                            student.student_group_id
                                        )
                                    "
                                    mat-icon-button
                                    aria-label="Pagar colegiatura"
                                >
                                    <span class="flex flex-col items-center">
                                        <mat-icon
                                            class="icon-size-6"
                                            [svgIcon]="'feather:plus-square'"
                                        ></mat-icon>
                                        <span class="text-xs"
                                            >Pagar colegiatura</span
                                        >
                                    </span>
                                </button>
                                <button
                                    *hasOperation="'dashboards/payments:Cobrar'"
                                    mat-icon-button
                                    aria-label="Pagar servicio"
                                    (click)="openServicesPaymentModal(student.student_group_id)"
                                >
                                    <span class="flex flex-col items-center">
                                        <mat-icon
                                            class="icon-size-6"
                                            [svgIcon]="'feather:plus-square'"
                                        ></mat-icon>
                                        <span class="text-xs"
                                            >Pagar servicio</span
                                        >
                                    </span>
                                </button>
                            </td>
                        </tr>
                    </ng-template>
                </p-table>
            </div>
        </div>
    </div>
    } @else {
    <div
        class="grid grid-cols-1 content-center items-center w-full h-40 sm:h-full"
    >
        <h2 class="text-center">No hay datos para mostrar</h2>
    </div>
    }}
</div>

<payment-modal></payment-modal>
<qr-modal></qr-modal>
<services-payment-modal></services-payment-modal>
<ticket-modal></ticket-modal>
<date-selector-modal></date-selector-modal>
