<p-dialog
    [header]="title"
    [(visible)]="isOpenModal"
    [modal]="true"
    [style]="{ width: '30vw' }"
    [breakpoints]="{ '700px': '90vw' }"
    [draggable]="false">
    <div class="grid grid-cols-1 w-full">
        <mat-form-field>
            <mat-label>Fecha de corte</mat-label>
            <input
                matInput
                type="date"
                placeholder="Fecha de corte"
                [formControl]="selectedDate"
            />
        </mat-form-field>
        <div class="flex flex-col items-center w-full mt-5">
            <button
                class="fuse-mat-button-rounded w-50"
                mat-flat-button
                [color]="'primary'"
                [disabled]="!selectedDate.value"
                (click)="printReport()"
            >
                <mat-icon
                    class="icon-size-5"
                    [svgIcon]="'heroicons_solid:printer'"
                ></mat-icon>
                <span class="ml-2">Imprimir</span>
            </button>
        </div>
    </div>
</p-dialog>
