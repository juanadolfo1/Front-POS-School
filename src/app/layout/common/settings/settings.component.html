<div
    class="fixed flex items-center justify-center right-0 w-10 h-10 shadow-lg rounded-l-lg z-90 cursor-pointer bg-primary print:hidden"
    style="top: 275px"
    (click)="settingsDrawer.toggle()">
    <mat-icon
        class="icon-size-5 text-white"
        [svgIcon]="'heroicons_solid:color-swatch'"></mat-icon>
</div>

<fuse-drawer
    class="w-screen min-w-screen sm:w-80 sm:min-w-80 z-999"
    fixed
    [mode]="'over'"
    [name]="'settingsDrawer'"
    [position]="'right'"
    #settingsDrawer>

    <div class="flex flex-col w-full overflow-auto bg-card">
        <div class="flex flex-row items-center px-6 h-16 min-h-16 text-white bg-primary">
            <mat-icon
                class="icon-size-6 text-current"
                [svgIcon]="'heroicons_solid:color-swatch'"></mat-icon>
            <div class="ml-3 text-lg font-semibold">Tema</div>
            <button
                class="ml-auto"
                mat-icon-button
                (click)="settingsDrawer.close()">
                <mat-icon
                    class="text-current"
                    [svgIcon]="'heroicons_outline:x'"></mat-icon>
            </button>
        </div>

        <div class="flex flex-col p-6">
            <!-- Theme colors -->
            <div class="text-sm font-semibold text-secondary mb-4">COLOR</div>
            <div class="grid grid-cols-3 gap-3">
                <ng-container *ngFor="let theme of config.themes">
                    <div
                        class="flex items-center justify-center px-4 py-3 rounded-full cursor-pointer ring-inset ring-primary bg-hover"
                        [class.ring-2]="config.theme === theme.id"
                        [ngClass]="theme.id"
                        (click)="setTheme(theme.id)">
                        <div class="flex-0 w-4 h-4 rounded-full bg-primary"></div>
                        <div
                            class="ml-2 text-sm font-medium leading-5 truncate"
                            [class.text-secondary]="config.theme !== theme.id">
                            {{theme.name}}
                        </div>
                    </div>
                </ng-container>
            </div>

            <hr class="my-6">

            <!-- Scheme -->
            <div class="text-sm font-semibold text-secondary mb-4">MODO</div>
            <div class="grid grid-cols-3 gap-3">
                <div
                    class="flex flex-col items-center py-3 px-2 rounded-lg cursor-pointer ring-inset ring-primary bg-hover"
                    [class.ring-2]="config.scheme === 'light'"
                    (click)="setScheme('light')">
                    <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:sun'"></mat-icon>
                    <span class="text-xs mt-1" [class.text-secondary]="config.scheme !== 'light'">Claro</span>
                </div>
                <div
                    class="flex flex-col items-center py-3 px-2 rounded-lg cursor-pointer ring-inset ring-primary bg-hover"
                    [class.ring-2]="config.scheme === 'dark'"
                    (click)="setScheme('dark')">
                    <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:moon'"></mat-icon>
                    <span class="text-xs mt-1" [class.text-secondary]="config.scheme !== 'dark'">Oscuro</span>
                </div>
                <div
                    class="flex flex-col items-center py-3 px-2 rounded-lg cursor-pointer ring-inset ring-primary bg-hover"
                    [class.ring-2]="config.scheme === 'auto'"
                    (click)="setScheme('auto')">
                    <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:lightning-bolt'"></mat-icon>
                    <span class="text-xs mt-1" [class.text-secondary]="config.scheme !== 'auto'">Auto</span>
                </div>
            </div>
        </div>
    </div>

</fuse-drawer>
